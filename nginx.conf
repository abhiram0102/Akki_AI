server {
    listen 80;
    server_name _;

    # ── React SPA ─────────────────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # All non-/api routes → SPA (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;

        # Immutable hash-named assets — cache forever
        location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── API proxy → FastAPI backend ───────────────────────────────────────────
    location /api {
        # Docker's embedded DNS, re-consulted every 10s.
        #
        # nginx resolves a proxy_pass hostname ONCE at startup and caches the
        # address forever. Every backend restart gives the container a new IP,
        # so the site returned 502 on every /api call -- including login --
        # until someone thought to restart the frontend too. Nothing in the
        # frontend logs said why, and the backend looked perfectly healthy on
        # its own port the whole time.
        #
        # A hostname held in a VARIABLE forces nginx to resolve per request
        # instead of at startup, which is what makes the resolver apply. The
        # explicit URI after $upstream is then required, because a variable
        # proxy_pass otherwise drops the request path.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $upstream http://backend:5000;
        proxy_pass         $upstream$request_uri;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE upgrade headers
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;

        # ── CRITICAL for SSE streaming ────────────────────────────────────────
        # Disable Nginx response buffering so chat tokens flow in real-time.
        # Without this, Nginx waits for the full response before sending anything.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;   # 5 min — long enough for any AI response
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        # Large file uploads (RAG documents up to 50 MB)
        client_max_body_size 60M;

        # Preserve SSE content-type
        proxy_hide_header  X-Accel-Buffering;
        add_header         X-Accel-Buffering no;
    }
}
